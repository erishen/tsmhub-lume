# tsmhub-lume CI —— 静态门禁 + 自包含冒烟 + docker 镜像构建/启动冒烟
#
# 全部自包含，不依赖本地镜像 / 兄弟 checkout / 上游服务：
#   - lume 二进制与 lume-core 由 make vendor 从 GitHub release 拉（v0.14.2）
#   - 镜像构建所需的 lume tarball 由 make 在宿主侧下载 + SHA256 校验后 COPY 进镜像
#     （构建期零网络依赖，避免 CI 内 apk CDN / GitHub 被 TLS 重置）
#   - 冒烟不要求上游 tsm-hub 在线（--no-upstream）
#
# 触发：push 到 main / 任意 PR。

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 静态门禁 + 自包含冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # vendor/lume/bin/lume + lume-core/lib 由 make vendor 从 release 拉取；
      # 脚本带幂等跳过（stamp 版本匹配即复用），这里缓存避免 CI 反复下载。
      - name: 缓存 lume 二进制 + lume-core
        uses: actions/cache@v4
        with:
          path: |
            vendor/lume/bin/lume
            vendor/lume-core/lib
          key: lume-vendor-${{ hashFiles('scripts/vendor_lume.sh') }}

      - name: 同步 lume 二进制 + lume-core（release fallback）
        run: make vendor

      - name: 静态门禁（lume --check + tsc + esbuild）
        run: make test

      - name: 自包含运行时冒烟（临时实例，测完清理）
        run: make test-local

  docker:
    name: 镜像构建 + 启动冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx（层缓存走 GHA）
        uses: docker/setup-buildx-action@v3

      # Dockerfile 的 lume-bin 阶段只 COPY 这份 tarball（不联网下载），
      # 所以必须在 build 之前由宿主侧生成并校验（Makefile 里 pin 了版本与 SHA256）。
      - name: 下载并校验 lume tarball
        run: make vendor/lume/lume-linux-x64-static.tar.gz

      - name: 构建镜像（tarball 已就绪；层缓存复用 npm ci）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tsmhub-lume:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 起容器并冒烟 BFF 自身端点
        run: |
          docker run -d --name tsmhub-lume-test -p 127.0.0.1:18108:18108 tsmhub-lume:test
          sleep 3
          curl -fsS http://127.0.0.1:18108/api/meta >/dev/null && echo "✓ /api/meta"
          curl -fsS http://127.0.0.1:18108/api/health >/dev/null && echo "✓ /api/health"
          curl -fsS http://127.0.0.1:18108/api/overview >/dev/null && echo "✓ /api/overview"
          curl -fsS http://127.0.0.1:18108/ >/dev/null && echo "✓ /"
          docker rm -f tsmhub-lume-test >/dev/null
