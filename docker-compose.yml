# tsmhub-lume —— 本机容器运行（宿主机 127.0.0.1:18108）
#
# 接入已有的 tsm-hub 容器所在网络（tsm-hub_default），容器内用
# http://tsm-hub:9070 访问上游（tsm-hub 只把 9070 暴露在自己的容器网络里，
# 宿主侧映射的 19070 在容器里够不着）。管理口令走挂载文件，不进镜像、不上命令行。
#
#   make docker            # 构建 + 起容器
#   make docker-logs       # 跟日志
#   make docker-down       # 停掉

services:
  tsmhub-lume:
    build:
      context: .
      args:
        # lume 二进制从 GitHub release 下载（Dockerfile 里 ARG LUME_VERSION）。
        LUME_VERSION: ${LUME_VERSION:-v0.14.2}
    image: tsmhub-lume:dev
    container_name: tsmhub-lume
    ports:
      - "127.0.0.1:18108:18108"
    environment:
      TSM_BASE: ${TSM_BASE:-http://tsm-hub:9070}
      TSM_WRITE_GATE: ${TSM_WRITE_GATE:-off}
      # 文件不存在时 admin_secret() 返回空串（上游未开鉴权的情况）。
      TSM_ADMIN_FILE: /app/.data/admin.token
      TSM_CLIENT_KEY: ${TSM_CLIENT_KEY:-}
      # lume agent（/react/api/chat）：OpenAI 兼容上游 = tsm-hub，Key 复用 TSM_CLIENT_KEY。
      # LLM_API_URL 必须是完整的 /v1/chat/completions 端点（C 层直接 POST 这个 URL）；
      # ROUTER_API_URL 单独给目录同步用 base（会拼 /v1/tools、/v1/tools/invoke）。
      # LLM_API_KEY 留空 = 内置离线演示引擎（agent-httpd 在 C 层读取，不走 DSL env()）。
      LLM_API_URL: ${LLM_API_URL:-http://tsm-hub:9070/v1/chat/completions}
      ROUTER_API_URL: ${ROUTER_API_URL:-http://tsm-hub:9070/v1}
      LLM_MODEL: ${LLM_MODEL:-auto}
      # 可选：页面 model 覆盖白名单（逗号分隔，须与 tsm-hub 路由名逐字一致）。
      # 留空 = 不限制，由 tsm-hub 路由表和 Key 权限裁决。
      LLM_ALLOWED_MODELS: ${LLM_ALLOWED_MODELS:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      LLM_API_KEY: ${TSM_CLIENT_KEY:-}
      LUME_BIND: 0.0.0.0
      LUME_PORT: "18108"
    volumes:
      # 可写：router 同步 MCP 目录缓存到 .data/mcp-servers-router.json；
      # admin.token 仍是 0600，仅容器用户可读。
      - ./.data:/app/.data
    networks:
      - tsm-hub_default
    restart: unless-stopped

networks:
  tsm-hub_default:
    external: true
